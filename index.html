  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg-mid);
    background-image:
      radial-gradient(ellipse 70% 42% at 50% 0%, rgba(217,181,74,.16), transparent 62%),
      var(--swirl-pattern),
      linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    background-repeat: no-repeat, repeat, no-repeat;
    background-size: 100% 100%, 280px 280px, cover;
    background-position: center top, center, center;
    color:var(--ink);
    font-family: "Special Elite", system-ui;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- header ---------- */
  header{
    padding:44px 20px 20px;
    text-align:center;
  }
  header h1{
     font-family: "Jacquarda Bastarda 9", serif;
    font-weight: 400;
   
    font-weight:500;
    font-size:clamp(2rem,7vw,2.6rem);
    margin:0 0 6px;
    color:var(--cream);
    text-shadow:0 2px 14px rgba(0,0,0,.35);
    letter-spacing:.01em;
  }
  header p{
    margin:0;
    font-size:.9rem;
    color:var(--header-sub);
    letter-spacing:.02em;
  }

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:34px;
    max-width:440px;
    margin:0 auto;
    padding:10px 22px 90px;
  }
  @media (min-width:680px){
    .grid{grid-template-columns:1fr 1fr;max-width:820px;gap:40px 28px;}
  }
  @media (min-width:1020px){
    .grid{grid-template-columns:1fr 1fr 1fr;max-width:1180px;}
  }

  .postcard-thumb{
    all:unset;
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:3/2;
    cursor:pointer;
    border-radius:6px;
    transform:rotate(var(--r,0deg));
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 18px 30px -14px rgba(0,0,0,.65);
    opacity:0;
    animation:riseIn .6s cubic-bezier(.2,.7,.3,1) forwards;
    animation-delay:var(--d,0s);
    transition:transform .35s ease;
  }
  .postcard-thumb:hover{ transform:rotate(var(--r,0deg)) translateY(-3px) scale(1.015); }
  .postcard-thumb:focus-visible{ outline:2px solid var(--cream); outline-offset:4px; }

  @keyframes riseIn{
    from{opacity:0; transform:rotate(var(--r,0deg)) translateY(14px);}
    to{opacity:1; transform:rotate(var(--r,0deg)) translateY(0);}
  }

  .pin{
    position:absolute;
    top:-6px; left:50%;
    width:11px; height:11px;
    margin-left:-5.5px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffc94d, var(--stamp) 65%);
    box-shadow:0 2px 3px rgba(0,0,0,.5);
    z-index:3;
  }

  /* ---------- poster (shared by thumb + front face) ---------- */
  .poster{
    position:absolute; inset:0;
    overflow:hidden;
    border-radius:6px;
    background:var(--paper);
  }
  .poster img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  .poster-copy{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 14px 12px;
    display:flex; align-items:baseline; gap:8px;
    background:linear-gradient(0deg, rgba(0,0,0,.28), transparent);
  }
  .poster-num{
    font-family: "Special Elite", system-ui;
    font-size:.62rem;
    letter-spacing:.12em;
    color:rgba(255,255,255,.75);
    text-transform:uppercase;
  }
  .poster-place{
    font-family: "Special Elite", system-ui;
    font-weight:600;
    font-size:clamp(1.1rem,4.4vw,1.5rem);
    color: #ffda86;
    margin:0;
    text-shadow:0 2px 10px rgba(0,0,0,.35);
  }

  /* ---------- viewer ---------- */
  .viewer{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    padding:24px;
    z-index:50;
  }
  .viewer.open{ display:flex; }
  .viewer-backdrop{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(255,205,140,.16), transparent 62%),
      rgba(9,7,5,.88);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity .35s ease;
  }
  .viewer.open .viewer-backdrop{ opacity:1; }

  .close-btn{
    all:unset;
    position:absolute;
    top:max(18px, env(safe-area-inset-top));
    right:18px;
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08);
    color:var(--cream);
    font-size:1.4rem;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  .close-btn:hover{ background:rgba(255,255,255,.16); }

  .flip-card{
    position:relative;
    width:clamp(280px, 92vw, 460px);
    height:clamp(187px, 61.33vw, 307px);
    perspective:1800px;
    z-index:1;
    transition:width .7s cubic-bezier(.4,.15,.2,1), height .7s cubic-bezier(.4,.15,.2,1);
  }
  .flip-card.flipped{
    width:clamp(230px, 66vw, 320px);
    height:clamp(345px, 99vw, 480px);
  }
  .flip-card.flipped.photo-back{
    width:clamp(260px, 88vw, 560px);
    height:clamp(380px, 74vh, 700px);
  }
  .flip-inner{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.4,.15,.2,1);
    cursor:pointer;
  }
  .flip-card.flipped .flip-inner{ transform:rotateX(180deg); }

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  }
  .face.back{ transform:rotateX(180deg); }

  /* letter / back face */
  .paper{
    position:absolute; inset:0;
    background:var(--paper);
    padding:16px 18px 14px;
    display:flex;
    flex-direction:column;
  }
  .paper-photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:sepia(.42) saturate(.65) brightness(1.1) contrast(.92);
  }
  .paper-overlay{
    position:absolute; inset:0;
    background:rgba(240,233,218,.82);
  }
  .paper-lines{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px);
    pointer-events:none;
  }
  .postmark-block{
    position:absolute; top:12px; right:14px;
    display:flex; align-items:flex-start; gap:8px;
    z-index:2;
  }
  .stamp-box{
    width:38px; height:48px;
    border:2px dashed rgba(35,43,68,.28);
    background:linear-gradient(135deg,#CBB48A,#A6875C);
    border-radius:2px;
    flex-shrink:0;
  }
  .postmark-circle{
    width:60px; height:60px;
    margin-top:6px; margin-right:-18px;
    border-radius:50%;
    border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:'Work Sans',sans-serif;
    font-size:.5rem;
    line-height:1.15;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
    mix-blend-mode:multiply;
    transform:rotate(-11deg) scale(0);
  }
  .postmark-circle.stamped{
    animation:stampIn .5s cubic-bezier(.3,1.6,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{ transform:rotate(-11deg) scale(2.4); opacity:0; }
    55%{ transform:rotate(-11deg) scale(.85); opacity:.6; }
    100%{ transform:rotate(-11deg) scale(1); opacity:.55; }
  }

  .letter-text{
    position:relative; z-index:1;
    font-family:'Caveat',cursive;
    font-size:clamp(1.05rem,4.4vw,1.3rem);
    font-weight:600;
    line-height:1.42;
    color:var(--ink);
    margin:34px 46px 0 0;
    flex:1;
  }
  .letter-sign{
    position:relative; z-index:1;
    font-family:'Caveat',cursive;
    font-size:1.2rem;
    font-weight:700;
    color:var(--ink);
    margin:0;
    text-align:right;
  }
  .letter-num{
    position:absolute; left:16px; bottom:10px;
    font-family:'Work Sans',sans-serif;
    font-size:.6rem;
    letter-spacing:.1em;
    color:var(--kraft);
    text-transform:uppercase;
  }

  .paper.photo-letter{
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .letter-photo{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .letter-num-inline{
    font-family:'Work Sans',sans-serif;
    font-size:.6rem;
    letter-spacing:.1em;
    color:var(--kraft);
    text-transform:uppercase;
  }

  .paper.link-letter{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
    padding:24px;
  }
  .link-hint{
    font-family:'Work Sans',sans-serif;
    font-size:.8rem;
    letter-spacing:.02em;
    color:var(--kraft);
    margin:0;
  }
  .letter-link{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:1.5rem;
    line-height:1.3;
    color:var(--ink);
    text-decoration:underline;
    text-decoration-color:var(--stamp);
    text-underline-offset:4px;
    word-break:break-word;
    padding:10px 18px;
    border:2px dashed rgba(35,43,68,.28);
    border-radius:8px;
    background:rgba(255,255,255,.35);
  }
  .letter-link:hover{ background:rgba(255,255,255,.6); }

  .hint{
    margin:18px 0 6px;
    font-size:.82rem;
    color:var(--muted);
    letter-spacing:.02em;
    z-index:1;
  }
  .dots{ display:flex; gap:6px; z-index:1; }
  .dots span{
    width:5px; height:5px; border-radius:50%;
    background:rgba(255,255,255,.25);
    transition:background .3s ease;
  }
  .dots span.active{ background:var(--cream); }

  @media (prefers-reduced-motion:reduce){
    .postcard-thumb, .flip-inner, .viewer-backdrop, .postmark-circle{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Majo's Postcards</h1>
  <p>Tap one to view it. Tap again to read what's on the back.</p>
</header>

<main class="grid" id="grid"></main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Postcard viewer">
  <div class="viewer-backdrop" id="backdrop"></div>
  <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>

  <div class="flip-card" id="flipCard">
    <div class="flip-inner" id="flipInner">
      <div class="face front" id="faceFront"></div>
      <div class="face back" id="faceBack"></div>
    </div>
  </div>

  <p class="hint" id="hint">Tap the postcard to read the letter</p>
  <div class="dots" id="dots"><span class="active"></span><span></span></div>
</div>

<script>
// ---------------------------------------------------------------
// HOW TO ADD A NEW POSTCARD
// 1. Save the front photo (and, for a letter, the back photo too)
//    into an "images" folder next to this HTML file. Use simple
//    names, e.g. images/majo-front.jpg and images/majo-back.jpg
// 2. Copy one of the entries below and change: place, img, and
//    either letterImg (a photographed letter) OR link (a plain
//    hyperlink on the back instead of a letter).
//    (id, num, rot, delay fill themselves in automatically if left out.)
// ---------------------------------------------------------------
const postcards = [
  {
    place: 'Ella',
    img: 'images/ella-front.png',
    letterImg: 'images/ella-back.png'
  },
  {
    place:'Ren',
    img: 'images/ren-front.jpg',
    letterImg: 'images/ren-back.jpg'
  },
   {
    place:'Xime A.',
    img: 'images/XimeA-front.jpg',
    letterImg: 'images/XimeA-back.jpg'
  },
  {
    place:'Xime B.',
    img: 'images/XimeB-front.jpg',
    link: 'https://view.genially.com/6a77779bdf155232e24ce5e5',
    linkLabel: 'Tap to open'   // optional — what shows instead of the raw URL
  },
    {
    place:'Luna',
    img: 'images/luna-front.png',
    letterImg: 'images/luna-back.jpg'
  },
  {
    place: 'Liz',
    img: 'images/liz-front.jpg',
    letterImg: 'images/liz-back.jpg'
  },
  {
    place: 'Elio',
    img: 'images/elio-front.jpg',
    letterImg: 'images/elio-back.png'
  },
  {
    place: 'Chees',
    img: 'images/chees-front.jpg',
    letterImg: 'images/chees-back.jpg'
  },
  {
    place: 'Rafa',
    img: 'images/rafa-front.jpg',
    letterImg: 'images/rafa-back.png'
  },
  {
    place: 'Aguilar',
    img: 'images/aguilar-front.jpg',
    letterImg: 'images/aguilar-back.png'
  },
  {
    place: 'Cons',
    img: 'images/cons-front.jpg',
    letterImg: 'images/cons-back.jpg'
  },
 {
    place: 'Milo',
    img: 'images/milo-front.jpg',
    letterImg: 'images/milo-back.png'
  },
  {
    place: 'Cam',
    img: 'images/cam-front.jpg',
    letterImg: 'images/cam-back.png'
  },
  {
    place: 'Alita',
    img: 'images/alita-front.png',
    letterImg: 'images/alita-back.png'
  },
   {
    place: 'Vic',
    img: 'images/vic-front.jpg',
    letterImg: 'images/vic-back.jpg'
  },

 
];

// Fill in anything left blank above (id, number, tilt, entrance timing)
postcards.forEach((card, i) => {
  if (card.id === undefined) card.id = i + 1;
  if (card.num === undefined) card.num = 'No. ' + String(i + 1).padStart(2, '0');
  if (card.rot === undefined) card.rot = (i % 2 ? 1 : -1) * (1 + (i % 3) * 0.6);
  if (card.delay === undefined) card.delay = i * 0.08;
});

const grid = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const backdrop = document.getElementById('backdrop');
const closeBtn = document.getElementById('closeBtn');
const flipCard = document.getElementById('flipCard');
const flipInner = document.getElementById('flipInner');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
const hint = document.getElementById('hint');
const dots = document.getElementById('dots').children;

function posterHTML(card){
  const src = card.img || `https://picsum.photos/seed/${card.seed}/700/467`;
  return `
    <div class="poster">
      <img src="${src}" alt="${card.place}" loading="lazy">
      <div class="poster-copy">
        <span class="poster-num">${card.num}</span>
        <h2 class="poster-place">${card.place}</h2>
      </div>
    </div>`;
}

function letterHTML(card){
  if(card.link){
    return `
      <div class="paper link-letter">
        <a class="letter-link" href="${card.link}" target="_blank" rel="noopener noreferrer">${card.linkLabel || card.link}</a>
        <span class="letter-num-inline">${card.num}</span>
      </div>`;
  }
  if(card.letterImg){
    return `
      <div class="paper photo-letter">
        <img class="letter-photo" src="${card.letterImg}" alt="Letter, ${card.place}">
      </div>`;
  }
  return `
    <div class="paper">
      <img class="paper-photo" src="https://picsum.photos/seed/${card.seed}-note/500/750" alt="">
      <div class="paper-overlay"></div>
      <div class="paper-lines"></div>
      <div class="postmark-block">
        <div class="postmark-circle" id="postmark">${card.place}<br>${card.date}</div>
        <div class="stamp-box"></div>
      </div>
      <p class="letter-text">${card.letter}</p>
      <p class="letter-sign">${card.sign} \u00b7 ${card.date}</p>
      <span class="letter-num">${card.num}</span>
    </div>`;
}

// build grid
postcards.forEach(card=>{
  const btn = document.createElement('button');
  btn.className = 'postcard-thumb';
  btn.style.setProperty('--r', card.rot+'deg');
  btn.style.setProperty('--d', card.delay+'s');
  btn.setAttribute('aria-label', 'Open postcard from ' + card.place);
  btn.innerHTML = '<span class="pin"></span>' + posterHTML(card);
  btn.addEventListener('click', ()=> openCard(card, btn));
  grid.appendChild(btn);
});

let activeCard = null;
let lastTrigger = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function openCard(card, triggerEl){
  activeCard = card;
  lastTrigger = triggerEl;

  faceFront.innerHTML = posterHTML(card);
  faceBack.innerHTML = letterHTML(card);
  flipCard.classList.toggle('photo-back', !!card.letterImg);
  flipCard.classList.remove('flipped');
  updateHint(false);

  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();

  if(!reduceMotion){
    const startRect = triggerEl.getBoundingClientRect();
    const cardEl = document.querySelector('.flip-card');
    requestAnimationFrame(()=>{
      const endRect = cardEl.getBoundingClientRect();
      const dx = startRect.left + startRect.width/2 - (endRect.left + endRect.width/2);
      const dy = startRect.top + startRect.height/2 - (endRect.top + endRect.height/2);
      const scale = Math.max(startRect.width/endRect.width, 0.15);
      cardEl.animate([
        { transform:`translate(${dx}px, ${dy}px) scale(${scale})`, opacity:0.6 },
        { transform:'translate(0,0) scale(1)', opacity:1 }
      ], { duration:420, easing:'cubic-bezier(.2,.8,.25,1)' });
    });
  }
}

function toggleFlip(){
  const flipped = flipCard.classList.toggle('flipped');
  updateHint(flipped);
  if(flipped){
    const pm = document.getElementById('postmark');
    if(pm){
      pm.classList.remove('stamped');
      void pm.offsetWidth; // restart animation
      pm.classList.add('stamped');
    }
  }
}

function updateHint(flipped){
  hint.textContent = flipped ? "Tap to flip back" : "Tap the postcard to read the letter";
  dots[0].classList.toggle('active', !flipped);
  dots[1].classList.toggle('active', flipped);
}

function closeViewer(){
  viewer.classList.remove('open');
  document.body.style.overflow = '';
  if(lastTrigger) lastTrigger.focus();
}

flipInner.addEventListener('click', toggleFlip);
closeBtn.addEventListener('click', closeViewer);
backdrop.addEventListener('click', closeViewer);
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && viewer.classList.contains('open')) closeViewer();
});
</script>
</body>
</html>
